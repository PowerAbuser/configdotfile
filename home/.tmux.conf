unbind C-b
set -g prefix C-SPACE
bind C-SPACE send-prefix

set -g mouse on
# Identificare tmux come terminale standard per compatibilità con sessioni remote
set-option -g default-terminal "tmux-256color"
# Colore a 24 bit per i programmi dentro tmux (il terminale esterno espone COLORTERM=truecolor)
set -ag terminal-features ',*:RGB'

unbind r
# Tenere su una sola riga: tpm interpreta una riga che inizia con `source-file`
# come un file sorgente e rileggerebbe questo config, duplicando i plugin
bind r source-file ~/.tmux.conf \; display 'Configurazione ricaricata'

# Buffer di 10k linee
set-option -g history-limit 10000

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'omerxx/tmux-sessionx'

# Set format for automatic window renaming. This overrides shell-provided titles.

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
# set -g @catppuccin_window_text '#[italics]#{window_name}'
set -g @catppuccin_window_text '#W'
# senza questa la finestra attiva usa il default di catppuccin (#T, il
# titolo del pane = hostname) invece del nome della finestra
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_date_time_text '%d.%m. %H:%M'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'

# catppuccin va caricato PRIMA: definisce le variabili @catppuccin_status_*
run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set-window-option -g status-position bottom

# cpu e battery vanno caricati DOPO: sostituiscono i segnaposto
# #{cpu_percentage} / #{battery_percentage} dentro status-right
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
run '~/.tmux/plugins/tmux-battery/battery.tmux'

set -g base-index 1
set -g pane-base-index 1

# set-window-option -g automatic-rename-format '#(basename "#{W}")'

set -g allow-rename off
# renumber when window is closed
set -g renumber-window on

# Nome finestra: percorso relativo alla radice della sessione se gira una
# shell (es. src/backend/rms), altrimenti il comando in esecuzione.
# La logica sta in tmux-window-relpath.sh (vedi i commenti li' dentro).
# Finche' il job non risponde si mostra il comando.
set -g automatic-rename-format "#{?#{m:*not ready*,#($HOME/.config/tmux/tmux-window-relpath.sh '#{window_id}' '#{pane_current_path}' '#{pane_current_command}')},#{pane_current_command},#{?#($HOME/.config/tmux/tmux-window-relpath.sh '#{window_id}' '#{pane_current_path}' '#{pane_current_command}'),#($HOME/.config/tmux/tmux-window-relpath.sh '#{window_id}' '#{pane_current_path}' '#{pane_current_command}'),#{pane_current_command}}}"

# resurrect salva il nome finestra gia' renderizzato e lo riapplica con
# rename-window, che disattiva automatic-rename: senza questo hook una finestra
# puo' restare bloccata sul nome vecchio dopo il restore.
set -g @resurrect-hook-post-restore-all "tmux list-windows -a -F '#{window_id}' | xargs -r -n1 -I@ tmux set-option -wu -t @ automatic-rename"

set -g @sessionx-custom-paths '~/Projects/arms,~/Projects/stancli,~/Projects/carbon'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
