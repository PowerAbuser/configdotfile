# include pywal colors
include ~/.config/kitty/theme.conf
# font_family FiraMono Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
# cursor_trail 1

font_size 12.0

# enable_image_protocol yes

# window
window_padding_width 2.5
window_margin_width 2.5
window_border_width 2px
active_border_color #b4b9bc
inactive_border_color #928C7A
enabled_layouts Tall, *

# sync_to_monitor no


# BEGIN_KITTY_FONTS
font_family      family='FiraMono Nerd Font' postscript_name=FiraMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
