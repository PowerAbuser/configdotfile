# Mainframe: phosphor terminal. Green on black, monospace, square boxes,
# no blur, heavy dim so the wallpaper reads like a dark CRT.
Font="JetBrains Mono"
FontSize="11"
RoundCorners="0"
HeaderText="ttyS0 · mainframe login"
HourFormat="HH:mm:ss"
DateFormat="yyyy-MM-dd"
FormPosition="left"
VirtualKeyboardPosition="left"
PartialBlur="false"
FullBlur="false"
HaveFormBackground="true"
DimBackground="0.7"
DimBackgroundColor="#000000"
FormBackgroundColor="#020a04"
BackgroundColor="#000000"
HeaderTextColor="#33ff66"
DateTextColor="#1fae48"
TimeTextColor="#33ff66"
LoginFieldBackgroundColor="#000000"
PasswordFieldBackgroundColor="#000000"
LoginFieldTextColor="#33ff66"
PasswordFieldTextColor="#33ff66"
UserIconColor="#33ff66"
PasswordIconColor="#33ff66"
PlaceholderTextColor="#1a7a35"
WarningColor="#ffb000"
LoginButtonTextColor="#000000"
LoginButtonBackgroundColor="#33ff66"
SystemButtonsIconsColor="#33ff66"
SessionButtonTextColor="#33ff66"
VirtualKeyboardButtonTextColor="#33ff66"
DropdownTextColor="#33ff66"
DropdownSelectedBackgroundColor="#0f3a1b"
DropdownBackgroundColor="#020a04"
HighlightTextColor="#000000"
HighlightBackgroundColor="#33ff66"
HighlightBorderColor="#33ff66"
HoverUserIconColor="#b6ffc8"
HoverPasswordIconColor="#b6ffc8"
HoverSystemButtonsIconsColor="#b6ffc8"
HoverSessionButtonTextColor="#b6ffc8"
HoverVirtualKeyboardButtonTextColor="#b6ffc8"
HideSystemButtons="false"
TranslatePlaceholderUsername="login:"
TranslatePlaceholderPassword="password:"
TranslateLogin="[ ENTER ]"
TranslateLoginFailedWarning="Login incorrect"
TranslateCapslockWarning="CAPS LOCK"
