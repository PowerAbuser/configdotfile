###########
# STARTUP #
###########
$scripts_dir = $HOME/.config/hypr/scripts

# Environment FIRST — before anything that needs Wayland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Then startup scripts and portals
exec-once = $scripts_dir/startup.sh
exec-once = /usr/lib/xdg-desktop-portal-hyprland
# exec-once = /usr/lib/xdg-desktop-portal-wlr

# Then everything else
exec-once = hypridle
exec-once = waybar
exec-once = nm-applet
exec-once = blueman-applet & blueman-tray
exec-once = solaar --window hide
exec-once = $scripts_dir/polkit.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# pypr LAST — after env is fully populated
exec-once = sleep 2 && /home/nazir-maman/.local/bin/pypr

#galaxybudsclient
# exec-once = galaxybudsclient /StartMinimized
