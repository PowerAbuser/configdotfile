# all the needed tags here

# browser tags
windowrule = tag +browser, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag +browser, match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable|-stable)?)$
windowrule = tag +browser, match:class ^(chrome-.+-Default)$ # Chrome PWAs
windowrule = tag +browser, match:class ^([Cc]hromium)$
windowrule = tag +browser, match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag +browser, match:class ^([Bb]rave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^([Tt]horium-browser|[Cc]achy-browser)$

# terminal
windowrule = tag +terminal, match:class ^(Alacritty|kitty|kitty-dropterm)$
windowrule = float on, match:class ^(kitty-dropterm)$

# drop terminal
# windowrulev2 = workspace special:S-term silent, class:^(kitty-dropterm)$
# windowrulev2 = size 75% 75%, class:^(kitty-dropterm)$
# windowrulev2 = center, class:^(kitty-dropterm)$ropterm)$

# file manager
windowrule = tag +file-manager, match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt|[Dd]olphin)$

# ide
windowrule = tag +ide, match:class ^(codium|codium-url-handler|VSCodium)$
windowrule = tag +ide, match:class ^(VSCode|code-url-handler|code)$
windowrule = tag +ide, match:class ^(jetbrains-.+)$ # JetBrains IDEs
