# Pyprland configuration
# Generated by pypr-quickstart
# 2026-05-08 13:48:19 UTC

[pyprland]
# workspaces_follow_focus REMOVED 2026-08-19: its event_focusedmon handler
# issued moveworkspacetomonitor on every monitor-focus change, and each move
# itself changed focus -> infinite feedback loop. Traced at ~8 cycles/sec,
# ~1850 events in 39s (focusedmon -> moveworkspace -> focusedmon ...), which
# dragged workspaces between monitors and left them on the wrong displays.
# NOTE: this plugin also provided `pypr change_workspace`, previously bound
# to SUPER+SHIFT+J/K -- those binds now use native dispatchers instead.
plugins = ["scratchpads", "magnify", "expose", "fetch_client_menu", "shift_monitors"]

[scratchpads]

[scratchpads.term]
animation = "fromTop"
size = "75% 70%"
command = "kitty --class kitty-dropterm"
class = "kitty-dropterm"
lazy = true
process_tracking = false

[scratchpads.music]
animation = "fromTop"
size = "75% 70%"
command = "spotify"
class = "Spotify"
lazy = true
process_tracking = false

[wallpapers]

[toggle_special]

[toggle_dpms]

[system_notifier]

[stash]

[shortcuts_menu]

[gamemode]

[fcitx5_switcher]


[fetch_client_menu]

[expose]
